     ============================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* =========================================================================
     TEMA / COLORES — cambiá estos valores para reestilizar toda la web
     ========================================================================= */
  :root {
    /* ===== PALETA — azul pizarra claro, moderno e inmersivo ===== */
    --fondo:        #152540;   /* fondo principal (azul pizarra, más vivo) */
    --fondo-alt:    #1b3157;   /* fondo de secciones alternas */
    --tarjeta:      #223c68;   /* fondo de tarjetas */
    --borde:        #3e5f96;   /* líneas y bordes */
    --texto:        #f3f7fd;   /* texto principal */
    --texto-suave:  #bccbe6;   /* texto secundario */
    --acento:       #00c2ff;   /* celeste eléctrico (Elektron) */
    --acento-2:     #ff8a3d;   /* naranja (Labelec) */
    --display: 'Sora', sans-serif;
    --body: 'Inter', sans-serif;
    --radio: 14px;
    --ancho: 1200px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--body);
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, .display { font-family: var(--display); line-height: 1.15; }

  a { color: inherit; text-decoration: none; }

  img { max-width: 100%; display: block; }

  .contenedor { width: 92%; max-width: var(--ancho); margin: 0 auto; }

  .seccion { padding: 96px 0; position: relative; }
  .seccion > .contenedor { position: relative; z-index: 1; }
  /* Baño de color de las secciones claras (celeste arriba, naranja abajo) */
  .seccion:not(.seccion--alt):not(.identidad-seccion)::before {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(70% 60% at 85% 0%, rgba(0,194,255,0.13), transparent 62%),
      radial-gradient(60% 55% at 0% 100%, rgba(255,138,61,0.09), transparent 62%);
  }
  /* Secciones alternas: degradado azul vivo + filos celestes */
  .seccion--alt {
    background:
      radial-gradient(80% 70% at 15% 0%, rgba(0,194,255,0.14), transparent 60%),
      radial-gradient(70% 70% at 95% 100%, rgba(255,138,61,0.10), transparent 60%),
      linear-gradient(160deg, var(--fondo-alt) 0%, #1f3a68 55%, var(--fondo-alt) 100%);
    border-top: 1px solid rgba(0,194,255,0.16);
    border-bottom: 1px solid rgba(0,194,255,0.16);
  }

  .eyebrow {
    display: inline-block; text-shadow: 0 0 18px rgba(0,194,255,0.45);
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--acento);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .titulo-seccion {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  .subtitulo-seccion {
    color: var(--texto-suave);
    max-width: 620px;
    margin-bottom: 56px;
    font-size: 1.05rem;
  }

  /* ===================== HEADER / NAV ===================== */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,14,23,0.72);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s, background .3s;
  }
  header.scrolled { border-bottom-color: var(--borde); }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    height: 92px;
  }
  .nav__logo { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 800; letter-spacing: 0.02em; }
  .nav__logo img { height: 58px; width: auto; }
  /* Recuadro claro detrás del logo para que resalte sobre el fondo oscuro.
     Si cargás "logoClaro" en datos.js, el recuadro no se aplica.
     👉 Ajustes: background = color del recuadro, padding = aire alrededor */
  img.realzar {
    background: linear-gradient(135deg, #ffffff, #e9eef7);
    padding: 7px 16px; border-radius: 12px;
    box-sizing: content-box; object-fit: contain;
    border: 1px solid rgba(0,194,255,.45);
    box-shadow: 0 4px 18px -6px rgba(0,0,0,.55), 0 0 18px -6px rgba(0,194,255,.55);
    transition: box-shadow .3s, transform .3s;
  }
  .nav__logo img.realzar { height: 42px; }
  .nav__logo:hover img.realzar {
    transform: translateY(-1px);
    box-shadow: 0 6px 22px -6px rgba(0,0,0,.6), 0 0 26px -4px rgba(0,194,255,.75);
  }
  @media (max-width: 620px) { .nav__logo img.realzar { height: 34px; padding: 6px 12px; } }
  .nav__links { display: flex; gap: 34px; }
  .nav__links a { font-size: 0.92rem; color: var(--texto-suave); font-weight: 500; transition: color .2s; }
  .nav__links a:hover { color: var(--texto); }
  .nav__toggle { display: none; background: none; border: 0; color: var(--texto); font-size: 1.6rem; cursor: pointer; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--acento); color: #041016;
    font-weight: 600; font-family: var(--display);
    padding: 12px 22px; border-radius: 999px;
    font-size: 0.92rem; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 6px 24px -8px var(--acento);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -8px var(--acento); }
  .btn--ghost { background: transparent; color: var(--texto); border: 1px solid var(--borde); box-shadow: none; }
  .btn--ghost:hover { border-color: var(--acento); color: var(--acento); }

  /* ===================== HERO (foto de fondo) ===================== */
  /* El hero ocupa toda la pantalla: título, valores y estadísticas entran
     sin scrollear. 👉 Si querés que sea más alto/bajo, tocá min-height. */
  .hero {
    position: relative; overflow: hidden;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    padding: 104px 0 0;
    border-bottom: 1px solid rgba(0,194,255,0.18);
  }
  .hero > .contenedor { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
  .hero .stats { margin-top: auto; }
  /* Foto de fondo a pantalla completa */
  /* ===== FOTO DEL HERO =====
     👉 "filter" controla brillo/saturación de la foto;
        los rgba del velo controlan cuánto se oscurece cada zona. */
  .hero__fondo {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: saturate(1.3) brightness(1.12) contrast(1.06);
  }
  /* Velo: oscurece solo detrás del texto y funde arriba/abajo,
     dejando la foto viva a ambos lados */
  .hero__velo {
    position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(90deg, rgba(8,14,28,0.80) 0%, rgba(8,14,28,0.58) 30%, rgba(8,14,28,0.30) 48%, rgba(8,14,28,0.12) 66%, rgba(8,14,28,0.30) 100%),
      linear-gradient(180deg, rgba(8,14,28,0.55) 0%, transparent 22%),
      linear-gradient(0deg, rgba(8,14,28,0.92) 0%, transparent 34%);
  }
  .hero__glow {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(circle at 72% 42%, rgba(0,194,255,0.16), transparent 46%);
    pointer-events: none;
  }
  /* Anillo decorativo animado */
  .hero__anillo {
    position: absolute; z-index: 2; pointer-events: none;
    top: 42%; right: 14%; transform: translate(50%,-50%);
    width: 620px; max-width: 62vw; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid rgba(0,194,255,0.55);
    box-shadow: 0 0 90px -10px rgba(0,194,255,0.45) inset,
                0 0 60px -22px rgba(0,194,255,0.55);
    animation: girar 34s linear infinite;
  }
  .hero__anillo::after {
    content: ''; position: absolute; inset: 8%;
    border-radius: 50%; border: 1px dashed rgba(0,194,255,0.38);
  }
  /* Punto de luz que recorre el anillo */
  .hero__anillo::before {
    content: ''; position: absolute; top: -6px; left: 50%;
    width: 11px; height: 11px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 16px 4px var(--acento);
    transform: translateX(-50%);
  }
  @keyframes girar { from { transform: translate(50%,-50%) rotate(0); } to { transform: translate(50%,-50%) rotate(360deg); } }

  /* Partículas flotantes */
  .hero__particulas { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .particula {
    position: absolute; bottom: -12px;
    border-radius: 50%; background: var(--acento);
    box-shadow: 0 0 10px var(--acento), 0 0 20px rgba(0,194,255,.55);
    opacity: 0; animation: flotar linear infinite;
  }
  @keyframes flotar {
    0%   { transform: translateY(0);      opacity: 0; }
    10%  { opacity: .95; }
    85%  { opacity: .75; }
    100% { transform: translateY(-88vh);  opacity: 0; }
  }

  .hero__contenido {
    position: relative; z-index: 2; max-width: 620px;
    padding-bottom: clamp(8px, 2vh, 30px);
  }
  .hero h1 {
    font-size: clamp(1.9rem, min(4.6vw, 7.4vh), 3.8rem);
    font-weight: 800; letter-spacing: -0.03em; margin-bottom: clamp(10px, 2.2vh, 22px);
    text-shadow: 0 2px 24px rgba(0,0,0,.45);
  }
  .hero h1 .destaca--celeste { color: var(--acento); text-shadow: 0 0 28px rgba(0,194,255,.35); }
  .hero h1 .destaca--naranja { color: var(--acento-2); text-shadow: 0 0 28px rgba(255,138,61,.35); }
  .hero h1 .destaca--degradado {
    background: linear-gradient(100deg, var(--acento) 12%, #9fd4ee 46%, var(--acento-2) 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { font-size: clamp(.95rem, 1.4vw, 1.15rem); color: #dbe4f3; max-width: 500px; margin-bottom: clamp(16px, 3vh, 34px); text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  .hero__acciones { display: flex; gap: 14px; flex-wrap: wrap; }
  .hero__acciones .btn { text-transform: uppercase; letter-spacing: .04em; font-size: .82rem; padding: 14px 24px; }
  .hero__acciones .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s; }
  .hero__acciones .btn:hover svg { transform: translateX(3px); }
  .hero__acciones .btn--ghost { border-color: rgba(255,255,255,.55); background: rgba(8,14,28,.25); }
  /* Eyebrow del hero: "GRUPO" blanco + "LABEKTRON" celeste + línea */
  #hero-eyebrow { color: var(--texto); display: inline-flex; align-items: center; gap: 14px; }
  #hero-eyebrow .ey-marca { color: var(--acento); margin-left: -8px; }
  #hero-eyebrow::after { content: ''; width: 120px; height: 1px; background: linear-gradient(90deg, var(--acento), transparent); }

  /* --- Fila de valores --- */
  .hero__valores {
    position: relative; z-index: 2;
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: clamp(18px, 3.4vh, 34px) 0 clamp(18px, 3.6vh, 46px); max-width: 680px;
  }
  .valor { text-align: left; padding: 0 26px; border-right: 1px solid var(--borde); }
  .valor:first-child { padding-left: 0; }
  .valor:last-child { border-right: 0; padding-right: 0; }
  .valor__ico {
    width: clamp(38px, 4.4vh, 46px); height: clamp(38px, 4.4vh, 46px); border-radius: 50%;
    background: rgba(42,55,82,0.6); border: 1px solid var(--borde);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px; transition: border-color .3s, transform .3s;
  }
  .valor:hover .valor__ico { border-color: var(--acento); transform: translateY(-3px); }
  .valor__ico svg { width: 20px; height: 20px; fill: none; stroke: var(--acento); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .valor__txt {
    font-family: var(--display); font-size: .72rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); line-height: 1.6;
  }
  .valor__txt b { display: block; color: var(--texto); font-weight: 600; }

  /* --- Barra de estadísticas --- */
  .stats {
    position: relative; z-index: 2;
    border-top: 1px solid rgba(0,194,255,.18);
    background: rgba(6,11,22,0.78); backdrop-filter: blur(6px);
  }
  .stats__cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: center; padding: clamp(16px, 2.6vh, 30px) 0; }
  .stats__nums { display: grid; grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 0 22px; border-right: 1px solid var(--borde); display: flex; align-items: flex-start; gap: 14px; }
  .stat__ico { flex: none; width: 36px; height: 36px; margin-top: 2px; }
  .stat__ico svg { width: 100%; height: 100%; fill: none; stroke: var(--acento); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(0,194,255,.45)); transition: transform .3s; }
  .stat:hover .stat__ico svg { transform: scale(1.1) rotate(-4deg); }
  .stat:first-child { padding-left: 0; }
  .stat:last-child { border-right: 0; padding-right: 0; }
  .stat__n { font-family: var(--display); font-size: 1.6rem; font-weight: 800; color: var(--texto); line-height: 1.1; }
  .stat__t { font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--texto-suave); margin-top: 5px; line-height: 1.5; }
  .stats__frase { padding-left: 26px; border-left: 1px solid var(--borde); }
  .stats__frase b { display: block; font-family: var(--display); font-size: 1.05rem; font-weight: 700; line-height: 1.35; color: var(--texto); }
  .stats__frase b + b { color: var(--acento); }
  .stats__frase p { margin: 10px 0 0; font-size: .86rem; color: var(--texto-suave); line-height: 1.55; }

  /* ===================== NUESTRA IDENTIDAD ===================== */
  .identidad-seccion { position: relative; overflow: hidden; }
  /* Foto fusionada a la derecha, difuminada hacia el fondo */
  /* ===== IMAGEN DE LA SECCIÓN IDENTIDAD =====
     👉 Para ajustarla, cambiá estos 3 valores:
        - opacity     : qué tan visible es la foto (1 = full, .5 = media)
        - width       : cuánto ocupa desde la derecha
        - mask-image  : desde dónde empieza a difuminarse (el %) */
  .identidad-seccion__fondo {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 52%;                 /* ancho de la foto (más chico = más a la derecha) */
    opacity: .85;               /* visibilidad de la foto */
    z-index: 0;
    background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 42%);
            mask-image: linear-gradient(90deg, transparent, #000 42%);
  }
  .identidad-seccion__velo {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, var(--fondo) 30%, rgba(26,36,55,0.65) 48%, transparent 62%);
  }
  .identidad { position: relative; z-index: 2; max-width: 620px; }
  .identidad__linea { width: 72px; height: 4px; border-radius: 4px; background: var(--acento); margin: 4px 0 28px; }
  .identidad__texto .titulo-seccion { margin-bottom: 8px; }
  .identidad__texto p { color: var(--texto-suave); margin-bottom: 20px; font-size: 1.02rem; line-height: 1.75; }
  .identidad__texto p:last-child { margin-bottom: 0; }
  .identidad__texto p b { color: var(--texto); font-weight: 700; }

  /* ===================== NUESTRAS EMPRESAS (tarjetas) ===================== */
  .empresas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .empresa-card {
    position: relative; display: block;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: var(--radio); padding: 42px 40px 36px; overflow: hidden;
    transition: transform .3s, border-color .3s, box-shadow .3s;
  }
  /* Barra de color arriba de cada tarjeta (usa el color de la empresa) */
  .empresa-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--empresa-color, var(--acento));
  }
  .empresa-card:hover {
    transform: translateY(-6px);
    border-color: var(--empresa-color, var(--acento));
    box-shadow: 0 20px 50px -24px var(--empresa-color, var(--acento));
  }
  /* Recuadro claro detrás del logo para que resalten los logos oscuros */
  .empresa-card__logo {
    display: inline-flex; align-items: center; justify-content: center;
    background: #f4f6fb; border-radius: 12px;
    padding: 16px 22px; margin-bottom: 22px;
    min-height: 86px; min-width: 150px;
  }
  .empresa-card__logo img { height: 54px; width: auto; object-fit: contain; margin: 0; }
  .empresa-card h3 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 4px; }
  .empresa-card .empresa-lema { color: var(--empresa-color, var(--acento)); font-family: var(--display); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 18px; }
  .empresa-card p { color: var(--texto-suave); margin-bottom: 24px; }
  .empresa-card .empresa-vermas {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--empresa-color, var(--acento)); font-family: var(--display); font-weight: 600; font-size: 0.95rem;
  }
  .empresa-card .empresa-vermas svg { width: 18px; height: 18px; fill: currentColor; transition: transform .3s; }
  .empresa-card:hover .empresa-vermas svg { transform: translateX(5px); }

  /* ===================== TRABAJOS ===================== */
  .grid-cards {
    display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: var(--radio); overflow: hidden;
    transition: transform .3s, border-color .3s;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--acento); box-shadow: 0 18px 44px -24px var(--acento); }
  .card__img { overflow: hidden; background: var(--fondo-alt); }
  .card__img img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
    transform: translateZ(0); will-change: transform; backface-visibility: hidden;
    transition: transform .4s;
  }
  .card:hover .card__img img { transform: scale(1.06); }
  .card__body { padding: 22px 24px 26px; }
  .card__body h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
  .card__body p { color: var(--texto-suave); font-size: 0.95rem; }
  /* Tarjeta clickeable (tiene galería) */
  .card--clic { cursor: pointer; }
  .card__vermas {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; color: var(--acento); font-size: 0.88rem;
    font-family: var(--display); font-weight: 600;
  }
  .card__vermas svg { width: 16px; height: 16px; fill: currentColor; transition: transform .3s; }
  .card--clic:hover .card__vermas svg { transform: translateX(4px); }

  /* ===================== MODAL DE GALERÍA (proyecto) ===================== */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(4,7,13,0.82); backdrop-filter: blur(6px);
  }
  .modal.abierto { display: flex; }
  .modal__caja {
    background: var(--fondo-alt); border: 1px solid var(--borde);
    border-radius: 18px; width: 100%; max-width: 960px;
    max-height: 90vh; overflow-y: auto;
    position: relative;
    animation: modalEntra .35s ease;
  }
  @keyframes modalEntra { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal__cerrar {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 1.5rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .2s;
  }
  .modal__cerrar:hover { background: var(--acento); color: #041016; }

  /* Carrusel dentro del modal */
  .galeria { position: relative; background: #05070c; border-radius: 18px 18px 0 0; overflow: hidden; }
  .galeria__viewport { aspect-ratio: 16/10; max-height: 62vh; }
  .galeria__pista { display: flex; height: 100%; transition: transform .4s ease; }
  .galeria__slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* "contain" muestra la foto ENTERA (no recorta). Ideal para fotos verticales. */
  .galeria__slide img { width: 100%; height: 100%; object-fit: contain; }
  .galeria__flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center; transition: background .2s;
  }
  .galeria__flecha:hover { background: var(--acento); color: #041016; }
  .galeria__flecha--izq { left: 14px; }
  .galeria__flecha--der { right: 14px; }
  /* Contador de fotos (ej: 3 / 12), más práctico que muchos puntitos */
  .galeria__contador {
    position: absolute; bottom: 14px; right: 16px; z-index: 2;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    color: #fff; font-size: .82rem; font-family: var(--display); font-weight: 600;
    padding: 5px 12px; border-radius: 999px;
  }
  .galeria__puntos { position: absolute; bottom: 14px; left: 0; right: 90px; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; z-index: 2; padding: 0 16px; }
  .galeria__punto { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: background .2s, transform .2s; }
  .galeria__punto.activo { background: var(--acento); transform: scale(1.3); }
  /* Con muchas fotos, ocultamos los puntitos y dejamos solo el contador + flechas */
  .galeria--muchas .galeria__puntos { display: none; }

  /* Contenido de texto del modal */
  .modal__cuerpo { padding: 32px 36px 40px; }
  .modal__cuerpo h2 { font-size: 1.7rem; font-weight: 800; margin-bottom: 20px; }
  .modal__detalles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px 24px; margin-bottom: 28px;
    padding-bottom: 28px; border-bottom: 1px solid var(--borde);
  }
  .modal__dato .etq { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); font-weight: 600; margin-bottom: 4px; }
  .modal__dato .val { color: var(--texto); font-size: 1rem; }
  /* Datos técnicos como lista de viñetas */
  .modal__tecnicos { grid-column: 1 / -1; margin-top: 4px; }
  .modal__tecnicos .etq { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); font-weight: 600; margin-bottom: 10px; }
  .modal__tecnicos ul { list-style: none; display: grid; gap: 9px; }
  .modal__tecnicos li {
    position: relative; padding-left: 26px; color: var(--texto); font-size: 1rem; line-height: 1.5;
  }
  .modal__tecnicos li::before {
    content: ''; position: absolute; left: 4px; top: 9px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--acento); box-shadow: 0 0 8px var(--acento);
  }
  .modal__cuerpo > p { color: var(--texto-suave); font-size: 1.02rem; line-height: 1.75; }

  .trabajos-cta { display: flex; justify-content: center; margin-top: 48px; }
  /* Botón que "late" y tiene un destello que lo cruza, para llamar la atención */
  .btn--pulso {
    position: relative; overflow: hidden;
    background: linear-gradient(100deg, var(--acento), #47d8ff 55%, var(--acento-2));
    color: #04121c; font-size: 1rem; padding: 16px 34px;
    animation: latir 2.8s ease-in-out infinite;
  }
  .btn--pulso svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; transition: transform .2s; }
  .btn--pulso:hover { transform: translateY(-2px) scale(1.03); animation-play-state: paused; }
  .btn--pulso:hover svg { transform: translateX(4px); }
  .btn--pulso::after {
    content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg); animation: destello 3.4s ease-in-out infinite;
  }
  @keyframes latir {
    0%, 100% { box-shadow: 0 8px 26px -10px var(--acento), 0 0 0 0 rgba(0,194,255,0.34); }
    50%      { box-shadow: 0 12px 34px -8px var(--acento), 0 0 0 12px rgba(0,194,255,0); }
  }
  @keyframes destello { 0% { left: -70%; } 55%, 100% { left: 130%; } }

  /* ===================== CLIENTES (carrusel deslizante) ===================== */
  .clientes-carrusel {
    position: relative; width: 100%; overflow: hidden;
    /* Difuminado suave en los bordes izq/der para que entren/salgan con elegancia */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .clientes-pista {
    display: flex; width: max-content;
    animation: desplazar var(--vel-carrusel, 40s) linear infinite;
  }
  /* Al pasar el mouse, se pausa */
  .clientes-carrusel:hover .clientes-pista { animation-play-state: paused; }

  .cliente {
    /* Fondo claro para que TODOS los logos resalten (incluidos los de letras oscuras) */
    flex: 0 0 auto; width: 190px; margin: 0 12px;
    background: #f4f6fb; border: 1px solid var(--borde);
    border-radius: var(--radio); padding: 26px 24px;
    display: flex; align-items: center; justify-content: center;
    min-height: 110px; transition: transform .3s, box-shadow .3s;
  }
  .cliente:hover { transform: translateY(-4px); box-shadow: 0 10px 30px -12px rgba(0,0,0,0.5); }
  .cliente img { max-height: 60px; width: auto; object-fit: contain; }

  @keyframes desplazar {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }  /* -50% porque la lista está duplicada */
  }
  /* Segunda fila: va en sentido contrario */
  @keyframes desplazar-inverso {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }
  .clientes-pista--inversa { animation-name: desplazar-inverso; }
  .clientes-carrusel + .clientes-carrusel { margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) {
    .clientes-pista { animation: none; flex-wrap: wrap; justify-content: center; }
  }


  /* ===================== SECTORES (tarjetas premium) ===================== */
  .sectores-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
  }
  .sector {
    position: relative; border-radius: 18px; overflow: hidden;
    aspect-ratio: 3/4.4; border: 1px solid var(--borde);
    isolation: isolate; cursor: default;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  /* Imagen de fondo */
  .sector__img { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .sector__img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 6s ease;
    /* Sin filter: evita el pixelado al escalar (el oscurecido lo hace la capa de arriba) */
  }
  /* Overlay oscuro para legibilidad */
  .sector::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(10,15,26,0.55) 0%, rgba(10,15,26,0.82) 55%, rgba(10,15,26,0.96) 100%);
    transition: background .3s ease;
  }
  /* Líneas de circuito sutiles (abajo) */
  .sector__circuito {
    position: absolute; left: 0; right: 0; bottom: 0; height: 130px; z-index: 2;
    opacity: .22; pointer-events: none; color: var(--acento);
    transition: opacity .3s ease;
  }
  .sector__circuito svg { width: 100%; height: 100%; }

  /* Contenido */
  .sector__cont {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; padding: 26px 24px;
  }
  .sector__ico {
    width: 52px; height: 52px; margin-bottom: auto;
    color: #fff; transition: color .3s ease, transform .3s ease;
  }
  .sector__ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .sector:hover .sector__ico { color: var(--acento); transform: translateY(-4px); }

  .sector h3 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -.01em; }
  .sector__linea { width: 34px; height: 3px; border-radius: 3px; background: var(--acento); margin-bottom: 14px; transition: width .3s ease; }
  .sector:hover .sector__linea { width: 54px; }
  .sector__desc { color: #cdd6e6; font-size: .95rem; line-height: 1.55; }

  /* Contador en la esquina (glassmorphism) */
  .sector__contador {
    position: absolute; top: 18px; right: 18px; z-index: 4;
    background: rgba(20,28,44,0.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 9px 14px; text-align: center;
    transition: border-color .3s ease, background .3s ease;
  }
  .sector:hover .sector__contador { border-color: var(--acento); }
  .sector__contador b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.05rem; color: #fff; line-height: 1; }
  .sector__contador span { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-suave); }

  /* Lista de servicios: oculta, se despliega en hover */
  .sector__servicios {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .35s ease, opacity .3s ease, margin-top .35s ease;
    opacity: 0; margin-top: 0;
  }
  .sector__servicios > ul { overflow: hidden; list-style: none; }
  .sector:hover .sector__servicios { grid-template-rows: 1fr; opacity: 1; margin-top: 18px; }
  .sector__servicios li {
    display: flex; align-items: center; gap: 9px;
    color: #e4ebf5; font-size: .9rem; padding: 5px 0;
  }
  .sector__servicios li svg { width: 15px; height: 15px; flex-shrink: 0; stroke: var(--acento); fill: none; stroke-width: 2.2; }

  /* Estados hover de la tarjeta */
  .sector:hover {
    transform: translateY(-6px);
    border-color: var(--acento);
    box-shadow: 0 24px 60px -26px rgba(0,194,255,0.55), 0 0 0 1px rgba(0,194,255,0.35);
  }
  .sector:hover .sector__img img { transform: scale(1.12); }
  .sector:hover::before { background: linear-gradient(180deg, rgba(10,15,26,0.42) 0%, rgba(10,15,26,0.78) 50%, rgba(10,15,26,0.96) 100%); }
  .sector:hover .sector__circuito { opacity: .5; }

  /* Partículas/destellos muy sutiles */
  .sector__chispa {
    position: absolute; z-index: 2; width: 3px; height: 3px; border-radius: 50%;
    background: var(--acento); box-shadow: 0 0 8px var(--acento);
    opacity: 0; transition: opacity .3s ease;
  }
  .sector:hover .sector__chispa { animation: chispa 2.4s ease-in-out infinite; }
  @keyframes chispa {
    0%, 100% { opacity: 0; transform: translateY(6px); }
    50% { opacity: .8; transform: translateY(-6px); }
  }

  /* Barra de valores debajo de los sectores */
  .sectores-valores {
    margin-top: 26px; border: 1px solid var(--borde); border-radius: 18px;
    background: rgba(255,255,255,0.02); backdrop-filter: blur(2px);
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .sec-valor {
    display: flex; align-items: center; gap: 15px;
    padding: 26px 28px; border-right: 1px solid var(--borde);
  }
  .sec-valor:last-child { border-right: 0; }
  .sec-valor__ico { width: 40px; height: 40px; flex-shrink: 0; color: var(--acento); }
  .sec-valor__ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .sec-valor b { display: block; font-family: var(--display); font-weight: 700; color: var(--acento); font-size: 1rem; }
  .sec-valor span { color: var(--texto-suave); font-size: .82rem; }

  /* ============ OFICINAS + UBICACIÓN (misma sección) ============ */
  /* Izquierda: tarjeta(s) de oficina · Derecha: mapa */
  .ubicacion-grid {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px 60px; align-items: stretch;
  }
  /* Línea divisoria central con degradado y un rombo de luz en el medio */
  .ubicacion-grid::before {
    content: ''; position: absolute; top: 6px; bottom: 6px; left: 50%; width: 1px;
    transform: translateX(-50%); pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,194,255,.55) 16%, rgba(0,194,255,.75) 50%, rgba(255,138,61,.55) 84%, transparent);
  }
  .ubicacion-grid::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 9px; height: 9px;
    transform: translate(-50%,-50%) rotate(45deg); pointer-events: none;
    background: var(--acento); box-shadow: 0 0 14px 2px rgba(0,194,255,.75);
  }
  .ubicacion-col { display: flex; flex-direction: column; }
  /* Título de cada columna */
  .col-titulo {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--display); font-size: 1.08rem; font-weight: 700;
    letter-spacing: .02em; color: var(--texto);
    padding-bottom: 14px; margin-bottom: 22px;
    border-bottom: 1px solid var(--borde);
  }
  .col-titulo__ico {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,194,255,.12); border: 1px solid rgba(0,194,255,.35);
  }
  .col-titulo__ico svg { width: 20px; height: 20px; fill: none; stroke: var(--acento); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ubicacion-col:last-child .col-titulo__ico { background: rgba(255,138,61,.12); border-color: rgba(255,138,61,.35); }
  .ubicacion-col:last-child .col-titulo__ico svg { stroke: var(--acento-2); }
  .oficinas-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .oficina { display: flex; flex-direction: column; }
  .oficina__img { flex: 1 1 auto; }
  .oficina {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: var(--radio); overflow: hidden;
  }
  .oficina__img { aspect-ratio: 16/10; overflow: hidden; background: #05070c; position: relative; min-height: 260px; }
  .oficina__img img { width: 100%; height: 100%; object-fit: contain; }
  /* Carrusel de fotos dentro de la tarjeta de oficina */
  .of-pista { display: flex; height: 100%; transition: transform .4s ease; }
  .of-slide { min-width: 100%; height: 100%; }
  .of-flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .25s, background .2s;
  }
  .oficina:hover .of-flecha { opacity: 1; }
  .of-flecha:hover { background: var(--acento); color: #041016; }
  .of-flecha--izq { left: 10px; }
  .of-flecha--der { right: 10px; }
  .of-puntos { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; z-index: 2; }
  .of-punto { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: background .2s, transform .2s; }
  .of-punto.activo { background: var(--acento); transform: scale(1.3); }
  .oficina__body { padding: 24px; }
  .oficina__body h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  .oficina__body p { color: var(--texto-suave); }

  /* ===================== CONTACTO / CTA ===================== */
  .cta {
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(0,194,255,0.12), transparent 60%),
      var(--fondo-alt);
    border-top: 1px solid var(--borde);
    padding: 110px 0;
  }
  .cta h2 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin-bottom: 20px; }
  .cta p { color: var(--texto-suave); max-width: 520px; margin: 0 auto 40px; font-size: 1.1rem; }

  /* ===================== MAPA / UBICACIÓN ===================== */
  .mapa-marco {
    position: relative; display: flex; flex-direction: column;
    border: 1px solid var(--borde); border-radius: var(--radio);
    overflow: hidden; background: var(--tarjeta);
    box-shadow: 0 20px 60px -30px rgba(0,0,0,0.8);
  }
  .mapa-marco iframe {
    display: block; width: 100%; flex: 1 1 auto; min-height: 320px; border: 0;
    /* Integra el mapa (claro) con el tema oscuro sin que desentone */
    /* Sin filter: mantiene la nitidez del mapa */
  }
  /* Cinta inferior con la dirección y botón para abrir en Google Maps */
  .mapa-pie {
    display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-top: 1px solid var(--borde); background: var(--fondo-alt);
  }
  .mapa-pie .btn { padding: 10px 18px; font-size: .86rem; }
  @media (max-width: 900px) {
    .ubicacion-grid { grid-template-columns: 1fr; gap: 36px; }
    /* En celular la división pasa a ser horizontal, entre las dos columnas */
    .ubicacion-grid::before {
      top: auto; bottom: auto; left: 0; right: 0; width: auto; height: 1px;
      transform: none;
      background: linear-gradient(90deg, transparent, rgba(0,194,255,.6), rgba(255,138,61,.5), transparent);
      display: none;
    }
    .ubicacion-grid::after { display: none; }
    .mapa-marco iframe { min-height: 300px; }
  }
  .mapa-pie__dir { display: flex; align-items: center; gap: 12px; color: var(--texto); font-size: 0.98rem; }
  .mapa-pie__dir svg { width: 20px; height: 20px; fill: none; stroke: var(--acento); stroke-width: 2; flex-shrink: 0; }

  /* ===================== FOOTER ===================== */
  .site-footer {
    border-top: 1px solid var(--borde);
    background: var(--fondo);
    padding: 72px 0 0;
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1.3fr;
    gap: 40px;
  }
  .footer-col h4 {
    font-family: var(--display); font-size: 1.05rem; font-weight: 700;
    letter-spacing: 0.05em; margin-bottom: 22px; color: var(--texto);
  }
  .footer-marca img { height: 44px; width: auto; margin-bottom: 22px; }
  .footer-marca p { color: var(--texto-suave); font-size: 0.95rem; max-width: 300px; margin-bottom: 24px; }
  .footer-redes { display: flex; gap: 12px; }
  .footer-redes a {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--borde); background: var(--tarjeta);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, transform .25s, background .25s;
  }
  .footer-redes a:hover { border-color: var(--acento); transform: translateY(-3px); background: var(--fondo-alt); }
  .footer-redes svg { width: 18px; height: 18px; fill: var(--texto-suave); transition: fill .25s; }
  .footer-redes a:hover svg { fill: var(--acento); }

  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 13px; }
  .footer-col ul a { color: var(--texto-suave); font-size: 0.95rem; transition: color .2s, padding-left .2s; }
  .footer-col ul a:hover { color: var(--acento); padding-left: 4px; }

  .footer-contacto li {
    display: flex; align-items: flex-start; gap: 12px;
    color: var(--texto-suave); font-size: 0.95rem; margin-bottom: 15px; list-style: none;
  }
  .footer-contacto ul { list-style: none; }
  .footer-contacto svg { width: 18px; height: 18px; fill: none; stroke: var(--acento); stroke-width: 2; flex-shrink: 0; margin-top: 2px; }
  .footer-contacto a { color: var(--texto-suave); transition: color .2s; word-break: break-word; }
  .footer-contacto a:hover { color: var(--acento); }

  .footer-base {
    border-top: 1px solid var(--borde); margin-top: 56px; padding: 26px 0;
    text-align: center; color: var(--texto-suave); font-size: 0.88rem;
  }

  /* ===================== BOTÓN WHATSAPP FLOTANTE ===================== */
  .wa-flotante {
    position: fixed; bottom: 24px; right: 24px; z-index: 90;
    width: 58px; height: 58px; border-radius: 50%;
    background: #25D366; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px -6px rgba(37,211,102,0.6);
    transition: transform .2s;
  }
  .wa-flotante:hover { transform: scale(1.08); }
  .wa-flotante svg { width: 30px; height: 30px; fill: #fff; }

  /* ===================== ANIMACIÓN DE ENTRADA ===================== */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 980px) {
    .hero__fondo { background-position: center; }
    .hero__velo { background: linear-gradient(0deg, rgba(8,14,28,.95) 6%, rgba(8,14,28,0.72) 55%, rgba(8,14,28,0.55) 100%); }
    .stats__frase { padding-left: 0; border-left: 0; }
    .hero__valores { max-width: 100%; }
    .stats__cols { grid-template-columns: 1fr; gap: 26px; }
  }
  @media (max-width: 620px) {
    .hero__valores { grid-template-columns: 1fr 1fr; gap: 26px 0; }
    .valor:nth-child(2) { border-right: 0; }
    .stats__nums { grid-template-columns: 1fr 1fr; gap: 24px 0; }
    .stat:nth-child(2) { border-right: 0; }

<script>

// --- Utilidad: escribe texto en un elemento si existe ---
function set(id, texto) { const el = document.getElementById(id); if (el) el.textContent = texto; }

// --- Datos generales ---
// Logo: usa la versión clara si existe; si no, realza el logo normal
(function() {
  const logo = EMPRESA.logoClaro || EMPRESA.logo;
  ['nav-logo', 'footer-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.src = logo;
    if (!EMPRESA.logoClaro) el.classList.add('realzar');
  });
})();
// Eyebrow: primera palabra en blanco, el resto en celeste
(function() {
  const [p, ...r] = EMPRESA.nombre.split(' ');
  document.getElementById('hero-eyebrow').innerHTML = r.length ? `${p} <span class="ey-marca">${r.join(' ')}</span>` : p;
})();
// Título: colorea las palabras de "destacarEnEslogan"; "|" = salto de línea
(function() {
  let d = EMPRESA.destacarEnEslogan;
  if (typeof d === 'string') d = [{ texto: d, color: 'degradado' }];
  let html = EMPRESA.eslogan;
  (d || []).forEach(x => {
    if (x.texto && html.includes(x.texto))
      html = html.replace(x.texto, `<span class="destaca--${x.color || 'degradado'}">${x.texto}</span>`);
  });
  document.getElementById('hero-titulo').innerHTML = html.split('|').join('<br>');
})();
// Imagen del hero
if (EMPRESA.imagenHero) document.getElementById('hero-fondo').style.backgroundImage = `url('${EMPRESA.imagenHero}')`;

// Partículas flotantes (efecto dinámico)
(function() {
  const cont = document.getElementById('hero-particulas');
  if (!cont) return;
  let html = '';
  for (let i = 0; i < 30; i++) {
    const x = Math.random()*100, dur = 9+Math.random()*9, del = Math.random()*10, sz = 3+Math.random()*4;
    html += `<span class="particula" style="left:${x}%;animation-duration:${dur}s;animation-delay:${del}s;width:${sz}px;height:${sz}px"></span>`;
  }
  cont.innerHTML = html;
})();

// --- Íconos compartidos (valores del hero y estadísticas) ---
const ICONOS = {
    rayo:      '<svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/></svg>',
    grafico:   '<svg viewBox="0 0 24 24"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>',
    escudo:    '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.3-3 8.3-7 9.5C8 20.3 5 16.3 5 12V6l7-3z"/></svg>',
    hoja:      '<svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-13 0 9-5 14-13 14H5v-1z"/><path d="M9 15c2-3 5-5 8-6"/></svg>',
    engranaje: '<svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>',
    reloj:     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    chip:      '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/></svg>',
    solar:     '<svg viewBox="0 0 24 24"><path d="M4 21l2-9h12l2 9z"/><path d="M5 16.5h14M10 12l-1 9M14 12l1 9"/><circle cx="12" cy="5.5" r="2"/><path d="M12 1.5v1M8.5 5.5h-1M16.5 5.5h-1M9.4 2.9l.7.7M14.6 2.9l-.7.7"/></svg>',
    fabrica:   '<svg viewBox="0 0 24 24"><path d="M3 21V11l5 3v-3l5 3v-3l5 3V4h3v17z"/><path d="M7 17h2M11 17h2M15 17h2"/></svg>',
    calendario:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/></svg>',
    edificio:  '<svg viewBox="0 0 24 24"><path d="M4 21V8l6-3v16M10 21V3l10 4v14M2 21h20"/><path d="M13 9h1M16 9h1M13 12h1M16 12h1M13 15h1M16 15h1M6.5 11h1M6.5 14h1"/></svg>',
    rayoCirculo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M13 6l-4.5 7H12l-1 5 4.5-7H12z"/></svg>',
};
// --- Los 4 valores del hero ---
(function() {
  const cont = document.getElementById('hero-valores');
  if (!cont || typeof VALORES_HERO === 'undefined') return;
  cont.innerHTML = VALORES_HERO.map(v => `
    <div class="valor">
      <div class="valor__ico">${ICONOS[v.icono] || ICONOS.rayo}</div>
      <div class="valor__txt"><b>${v.linea1}</b>${v.linea2}</div>
    </div>`).join('');
})();

// --- Barra de estadísticas ---
(function() {
  const cont = document.getElementById('stats-nums');
  if (!cont || typeof ESTADISTICAS === 'undefined') return;
  if (!ESTADISTICAS.length) { document.getElementById('stats').style.display = 'none'; return; }
  cont.innerHTML = ESTADISTICAS.map(s => `
    <div class="stat">
      ${s.icono && ICONOS[s.icono] ? `<div class="stat__ico">${ICONOS[s.icono]}</div>` : ''}
      <div>
        <div class="stat__n">${s.numero}</div>
        <div class="stat__t">${s.texto}</div>
      </div>
    </div>`).join('');
  if (typeof FRASE_ESTADISTICAS !== 'undefined') {
    const f = FRASE_ESTADISTICAS;
    document.getElementById('stats-frase').innerHTML =
      `<b>${f.linea1 || ''}</b><b>${f.linea2 || ''}</b>` + (f.linea3 ? `<p>${f.linea3}</p>` : '');
  }
})();
set('hero-desc', EMPRESA.descripcionHero);
(function() {
  const flecha = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  document.getElementById('hero-boton1').innerHTML = EMPRESA.botonHero1 + flecha;
  document.getElementById('hero-boton2').innerHTML = EMPRESA.botonHero2 + flecha;
})();
set('nav-boton', BOTON_CONTACTO);
set('footer-copy', EMPRESA.footerCopyright);
set('footer-nombre', EMPRESA.nombre);
document.getElementById('anio').textContent = new Date().getFullYear();

// --- Menú de navegación ---
document.getElementById('menu').innerHTML = MENU.map(m =>
  `<a href="${m.ancla}">${m.texto}</a>`).join('');

// --- Títulos de cada sección (eyebrow / título / subtítulo) ---
for (const clave in SECCIONES) {
  const s = SECCIONES[clave];
  const eb = document.querySelector(`[data-eyebrow="${clave}"]`);
  const ti = document.querySelector(`[data-titulo="${clave}"]`);
  const su = document.querySelector(`[data-subtitulo="${clave}"]`);
  if (eb) eb.textContent = s.eyebrow || '';
  if (ti) ti.textContent = s.titulo || '';
  if (su) { su.textContent = s.subtitulo || ''; if (!s.subtitulo) su.style.display = 'none'; }
}

// --- Sección de contacto (CTA) ---
set('cta-titulo', SECCIONES.contacto.titulo);
set('cta-subtitulo', SECCIONES.contacto.subtitulo);
set('cta-wa', SECCIONES.contacto.boton);
document.getElementById('btn-todos-trabajos').innerHTML =
  SECCIONES.trabajos.boton + '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

// --- WhatsApp ---
const waLink = 'https://wa.me/' + EMPRESA.whatsapp + '?text=' + encodeURIComponent(EMPRESA.whatsappTexto);
document.getElementById('cta-wa').href = waLink;
document.getElementById('wa-flotante').href = waLink;

// --- Títulos de las dos columnas (oficina / mapa) ---
(function() {
  const o = SECCIONES.oficinas || {};
  set('col-titulo-oficina', o.tituloFotos || 'Nuestra oficina');
  set('col-titulo-mapa',    o.tituloMapa  || 'Nuestra ubicación');
})();

// --- Mapa / ubicación ---
(function() {
  const m = SECCIONES.mapa;
  if (!m || !m.direccion) return;
  const dir = encodeURIComponent(m.direccion);
  // Mapa embebido (no necesita clave de API)
  document.getElementById('mapa-iframe').src =
    `https://maps.google.com/maps?q=${dir}&z=${m.zoom || 16}&output=embed`;

})();

// --- Utilidad: crea imagen con carga diferida (lazy) ---
function img(src, alt) {
  return `<img src="${src}" alt="${alt}" loading="lazy" decoding="async"
           onerror="this.style.opacity=.25;this.alt='Falta: '+this.src">`;
}

document.getElementById('identidad-parrafos').innerHTML = SECCIONES.grupo.parrafos.map(p => {
  const negrita = p.titulo ? `<b>${p.titulo}</b> ` : '';
  return `<p>${negrita}${p.texto}</p>`;
}).join('');

// Velocidad configurable desde datos.js (la 2da fila va un poco distinta para que se note)

document.getElementById('oficinas-grid').innerHTML = OFICINAS.map((o, idx) => {
  // Acepta "imagenes" (lista) o "imagen" (una sola, formato viejo)
  const fotos = o.imagenes && o.imagenes.length ? o.imagenes : (o.imagen ? [o.imagen] : []);
  const varias = fotos.length > 1;
  const controles = varias ? `
      <button class="of-flecha of-flecha--izq" data-of="${idx}" data-dir="-1" aria-label="Anterior">‹</button>
      <button class="of-flecha of-flecha--der" data-of="${idx}" data-dir="1" aria-label="Siguiente">›</button>
      <div class="of-puntos">
        ${fotos.map((_, i) => `<span class="of-punto ${i===0?'activo':''}" data-of="${idx}" data-i="${i}"></span>`).join('')}
      </div>` : '';
  return `
  <div class="oficina reveal">
    <div class="oficina__img">
      <div class="of-pista" data-pista="${idx}">
        ${fotos.map(f => `<div class="of-slide">${img(f, o.ciudad)}</div>`).join('')}
      </div>
      ${controles}
    </div>
    <div class="oficina__body">
      <h3>${o.ciudad}</h3>
      <p>${o.descripcion || o.direccion}</p>
    </div>
  </div>`;
}).join('');

// Lógica de los carruseles de oficina
(function() {
  const pos = {};   // guarda la foto actual de cada oficina
  function mover(idx, nuevo) {
    const pista = document.querySelector(`[data-pista="${idx}"]`);
    if (!pista) return;
    const total = pista.children.length;
    pos[idx] = (nuevo + total) % total;
    pista.style.transform = `translateX(-${pos[idx] * 100}%)`;
    document.querySelectorAll(`.of-punto[data-of="${idx}"]`).forEach((p, i) =>
      p.classList.toggle('activo', i === pos[idx]));
  }
  document.getElementById('oficinas-grid').addEventListener('click', e => {
    const flecha = e.target.closest('.of-flecha');
    if (flecha) {
      const idx = flecha.dataset.of;
      mover(idx, (pos[idx] || 0) + parseInt(flecha.dataset.dir));
      return;
    }
    const punto = e.target.closest('.of-punto');
    if (punto) mover(punto.dataset.of, parseInt(punto.dataset.i));
  });
})();

// --- Header con sombra al hacer scroll ---
const header = document.getElementById('header');
addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 20));

// --- Menú móvil ---
const menu = document.getElementById('menu');
document.getElementById('toggle').onclick = () => menu.classList.toggle('abierto');
menu.querySelectorAll('a').forEach(a => a.onclick = () => menu.classList.remove('abierto'));

// --- Animación de entrada al hacer scroll ---
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
